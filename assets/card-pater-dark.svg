<rect x="462.8" y="40" width="105.2" height="28" rx="14" fill="none" stroke="#2B2723"/>
<circle class="pulse" cx="477.8" cy="54" r="3.5" fill="#7FB2A6"/>
<text x="488.8" y="58.5" class="mono" font-size="12.5" letter-spacing="1.2" fill="#948B7F">TRAINING</text>
<text x="30" y="122" class="serif" font-size="42" letter-spacing="-.5" fill="#F2ECE3">PATER AI</text>
<text x="32" y="158" class="sans" font-size="17" fill="#948B7F">Telugu Catholic theological assistant, with a</text>
<text x="32" y="183" class="sans" font-size="17" fill="#948B7F">desensitisation corpus that fixes over-refusal.</text>
<line x1="32" y1="212" x2="568" y2="212" stroke="#2B2723"/>
<text x="32.0" y="250" class="mono" font-size="21" font-weight="600" fill="#E9A13B">72B</text>
<text x="32.0" y="272" class="sans" font-size="13" fill="#948B7F">Qwen2.5 base</text>
