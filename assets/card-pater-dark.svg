<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="PATER AI — Telugu Catholic theological assistant, with a desensitisation corpus that fixes over-refusal.">
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Noto Serif','DejaVu Serif',serif} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace} .te{font-family:'Noto Sans Telugu','Nirmala UI','Telugu Sangam MN','Gautami',sans-serif}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.k{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s cubic-bezier(.6,0,.2,1) forwards}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.cur{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.k,.r{animation:none;opacity:1;stroke-dashoffset:0}.cur,.pulse{animation:none}}
</style>
<rect width="600" height="300" rx="18" fill="#0C0B0A"/>
<rect x="0.5" y="0.5" width="599" height="299" rx="18" fill="#151311" stroke="#2B2723"/>
