name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # regenerate every 12 hours
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake game from a github contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: Pariseashishbannu
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#E11D48&color_dots=#E3EEF4,#A9D8EA,#5FB8DA,#1E8FBA,#0F6A8E
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF3B5C&color_dots=#0A2233,#0E4A66,#1583A8,#39C6EE,#BFF3FF

      - name: Push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
