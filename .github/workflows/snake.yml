name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # regenerate every 12 hours
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake game from a github contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: Pariseashishbannu
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#B5690F&color_dots=#EFE8DC,#F0D3A6,#E2B06A,#C98729,#9A5A0C
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#E9A13B&color_dots=#1E1B18,#4A3418,#7A5520,#B57A2A,#E9A13B

      - name: Push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
