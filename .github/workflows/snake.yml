name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # regenerate every 12 hours
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake game from a github contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: Pariseashishbannu
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0B8A45&color_dots=#E4EFE8,#A8E6BF,#5FD08D,#1FA85C,#0B7A3E
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF4D5E&color_dots=#121B16,#154A2B,#1C7A45,#2BC46C,#3DFF8B

      - name: Push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
